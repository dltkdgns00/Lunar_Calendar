<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- 은은한 장식 원광 -->
  <circle cx="240" cy="315" r="220" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle cx="950" cy="180" r="180" fill="#60a5fa" opacity="0.1" filter="url(#glow)" />

  <!-- 달 아이콘 -->
  <g transform="translate(140, 200)">
    <circle cx="100" cy="100" r="90" fill="#fbbf24" />
    <circle cx="140" cy="80" r="85" fill="#0f172a" />
  </g>

  <!-- 메인 텍스트 영역 -->
  <g transform="translate(420, 210)">
    <!-- 뱃지 -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="#3b82f6" fill-opacity="0.25" stroke="#3b82f6" stroke-width="2" />
    <text x="110" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700" fill="#60a5fa" text-anchor="middle">iCalendar (.ics) 생성기</text>

    <!-- 메인 타이틀 -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">음력 생일 캘린더</text>

    <!-- 서브텍스트 -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="500" fill="#94a3b8">
      매년 달라지는 음력 생일을 Google / Apple 캘린더에
    </text>
    <text x="0" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700" fill="#38bdf8">
      원클릭으로 한 번에 등록하세요
    </text>
  </g>

  <!-- 하단 도메인 표시 -->
  <text x="600" y="580" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="500" fill="#64748b" text-anchor="middle">
    dltkdgns00.github.io/Lunar_Calendar
  </text>
</svg>
